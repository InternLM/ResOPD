name: ResOPD CPU checks

on:
  push:
    paths:
      - 'verl/trainer/distillation/resopd.py'
      - 'verl/workers/rollout/vllm_rollout/prompt_logprobs.py'
      - 'tests/resopd/**'
      - '.github/workflows/resopd-cpu.yml'
  pull_request:
    paths:
      - 'verl/trainer/distillation/resopd.py'
      - 'verl/workers/rollout/vllm_rollout/prompt_logprobs.py'
      - 'tests/resopd/**'
      - '.github/workflows/resopd-cpu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  estimator-and-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install pytest
      - run: python -m pytest tests/resopd/test_estimator.py tests/resopd/test_teacher_payload.py -q
